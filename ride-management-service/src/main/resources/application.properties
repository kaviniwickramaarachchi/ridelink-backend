spring.application.name=ride-management-service
server.port=8083

spring.datasource.url=${RIDELINK_RIDE_DB_URL}
spring.datasource.username=${RIDELINK_RIDE_DB_USERNAME}
spring.datasource.password=${RIDELINK_RIDE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true

driver.service.base-url=${DRIVER_SERVICE_BASE_URL:http://localhost:8082}
driver.service.internal-api-key=${INTERNAL_API_KEY:}
driver.service.connect-timeout=${DRIVER_SERVICE_CONNECT_TIMEOUT:2s}
driver.service.read-timeout=${DRIVER_SERVICE_READ_TIMEOUT:5s}

fare.service.base-url=${FARE_SERVICE_BASE_URL:http://localhost:8084}
fare.service.internal-api-key=${INTERNAL_API_KEY:}
fare.service.connect-timeout=${FARE_SERVICE_CONNECT_TIMEOUT:2s}
fare.service.read-timeout=${FARE_SERVICE_READ_TIMEOUT:5s}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
