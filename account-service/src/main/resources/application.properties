spring.application.name=account-service
server.port=8081
# Support IDE launches from the repository root and Maven launches from the service directory.
spring.config.import=optional:file:./account-service/application-local.properties,optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ridelink_account_db?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
app.jwt.secret=${JWT_SECRET}
server.error.include-message=never
